# Builds, tests and publishes GeoVali to nuget.org on every push to main.
#
# The version comes from the Conventional Commits since the last tag, so a push
# carrying only docs or chores builds and tests but publishes nothing. See
# .github/scripts/next-version.sh for the bump rules.
#
# Publishing uses NuGet trusted publishing (OIDC): there is no API key stored in
# this repository. The policy on nuget.org is bound to this file's name, so
# renaming this file breaks publishing until the policy is updated to match.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # create the release tag
  id-token: write # request the OIDC token nuget.org exchanges for a short-lived key

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # next-version.sh reads the whole history and its tags

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Check the version rules
        run: .github/scripts/next-version.test.sh

      - name: Work out the next version
        id: version
        run: .github/scripts/next-version.sh | tee -a "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release -p:Version=${{ steps.version.outputs.version }}

      - name: Test
        run: dotnet test --no-build -c Release

      # Everything below runs only when the commits since the last tag actually
      # warrant a release.

      - name: Check the publishing secret is set
        if: steps.version.outputs.bump != 'none'
        env:
          NUGET_USER: ${{ secrets.NUGET_USER }}
        run: |
          if [[ -z "$NUGET_USER" ]]; then
            echo "::error::NUGET_USER is not set. Add your nuget.org username (not your email) as a repository secret."
            exit 1
          fi

      - name: Pack
        if: steps.version.outputs.bump != 'none'
        run: >
          dotnet pack src/GeoVali/GeoVali.csproj --no-build -c Release
          -p:Version=${{ steps.version.outputs.version }} -o artifacts

      - name: Get a short-lived nuget.org key
        if: steps.version.outputs.bump != 'none'
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to nuget.org
        if: steps.version.outputs.bump != 'none'
        run: >
          dotnet nuget push artifacts/*.nupkg
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      # Tagging last means a failed publish leaves no tag, so the next push
      # retries the same version rather than skipping it.
      - name: Tag the release
        if: steps.version.outputs.bump != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: >
          gh release create "v$VERSION" artifacts/*.nupkg
          --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes
